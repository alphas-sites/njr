<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cliente Fácil - Configuração</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>
Configuração da Empresa
</h1>


<input 
type="text"
id="empresaNome"
placeholder="Nome da empresa">



<input 
type="text"
id="empresaTelefone"
placeholder="Telefone">



<input 
type="text"
id="empresaEndereco"
placeholder="Endereço">



<input 
type="file"
id="empresaLogo"
accept="image/*">



<button
 onclick="salvarConfiguracoes()">

Salvar Configuração

</button>



</div>



<script src="configuracao.js"></script>


</body>

</html>
